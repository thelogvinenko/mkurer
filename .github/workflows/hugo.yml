name: Deploy Hugo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Mkurier logo and Magnit headline
        if: ${{ hashFiles('layouts/partials/brand.html') == '' }}
        run: |
          python3 - <<'PYTHON'
          import base64,gzip,json
          from pathlib import Path
          files=json.loads(gzip.decompress(base64.b64decode("")))
          for name,content in files.items():
              path=Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layouts static/css/style.css
          git commit -m "Add Mkurier wordmark and red Magnit delivery heading"
          git push origin HEAD:main
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.145.0
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" version
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: '"$RUNNER_TEMP/hugo" --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - name: Check local links and images
        run: python3 scripts/check_site.py public "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

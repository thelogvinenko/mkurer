name: Deploy Hugo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install refreshed courier images
        run: |
          python3 - <<'PYASSETS'
          import base64, json
          from pathlib import Path
          files=json.loads('{"content/_index.md": "", "data/magnit.json": "", "layouts/partials/magnit-page.html": "", "static/image/redrawn/README.md": "", "static/image/redrawn/magnit-hero-v2.webp": "", "static/image/redrawn/magnit-team-v2.webp": "", "static/image/redrawn/magnit-bike-v2.webp": "", "static/image/redrawn/magnit-car-v2.webp": "", ".github/workflows/hugo.yml": ""}')
          for name, data in files.items():
              p=Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          PYASSETS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/_index.md data/magnit.json layouts/partials/magnit-page.html static/image/redrawn .github/workflows/hugo.yml
          git commit -m "Replace main courier photographs with new artwork [skip ci]"
          git push
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.145.0
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" version
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: '"$RUNNER_TEMP/hugo" --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - name: Check local links and images
        run: python3 scripts/check_site.py public "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

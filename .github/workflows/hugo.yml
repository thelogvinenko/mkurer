name: Deploy Hugo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared Hugo source and images once
        if: ${{ hashFiles('hugo.toml') == '' }}
        run: |
          python3 - <<'PYTHON'
          import base64, io, json, shutil, time, urllib.request, concurrent.futures
          from pathlib import Path
          from zipfile import ZipFile
          ZipFile(io.BytesIO(base64.b64decode(""))).extractall('.')
          folder=Path('static/image')
          rows=json.loads((folder/'sources.json').read_text())
          def download(row):
              name=row.get('downloadedAs',row['file'])
              target=folder/name
              if target.exists(): return
              url=row.get('downloadURL',row['source'])
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(request,timeout=50) as response: data=response.read()
                      if not data: raise RuntimeError('Empty image '+name)
                      target.write_bytes(data)
                      return
                  except Exception:
                      if attempt==3: raise
                      time.sleep(2+attempt*2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(download, rows))
          for src,dst in [('reference-01.png','magnit-logo.png'),('reference-06.png','magnit-card.png'),('reference-39.png','magnit-hero.png')]:
              shutil.copyfile(folder/src,folder/dst)
          print('Hugo source imported; original images downloaded:',len(rows))
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import Hugo website source and local images"
          git push origin HEAD:main
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.145.0
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" version
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: '"$RUNNER_TEMP/hugo" --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - name: Check local links and images
        run: python3 scripts/check_site.py public "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
